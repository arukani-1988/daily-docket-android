name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing key missing. Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|\berror\b|FAILURE|What went wrong" -A3 build.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DailyDocket.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DailyDocket-apk
          path: DailyDocket.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Daily Docket 1.0.${{ github.run_number }}
          body: Install DailyDocket.apk on your Android phone. Installing over an older version keeps your entries.
          files: DailyDocket.apk
