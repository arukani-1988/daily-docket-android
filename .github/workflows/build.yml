name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing key not added yet: building a test version only, nothing is published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TASK: ${{ steps.key.outputs.signed == 'true' && ':app:assembleRelease' || ':app:assembleDebug' }}
        run: |
          set -o pipefail
          gradle "$TASK" --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|What went wrong|Could not|AAPT|Execution failed" -A4 build.log | head -80 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Publish release
        if: steps.key.outputs.signed == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk DailyDocket.apk

      - uses: softprops/action-gh-release@v2
        if: steps.key.outputs.signed == 'true'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Daily Docket 1.0.${{ github.run_number }}
          body: Install DailyDocket.apk on your Android phone. Installing over an older version keeps your entries.
          files: DailyDocket.apk
